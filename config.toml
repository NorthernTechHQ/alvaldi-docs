baseurl = "/"
languageCode = "en"
title = "Alvaldi Docs"
theme = "docs"
copyright = "&copy; 2023 <a href=\"https://northern.tech\">Northern.tech</a> AS"
enableRobotsTXT = true

# this parameter is set by Hugo from HUGO_PARAMS_SEARCHENGINES_DISABLED environment variable
# that we define on the build stage
# it is false by default to avoid a case when it was accidentally not defined
[params.searchengines]
disabled = false

# Number of posts per page
[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"

[markup]
[markup.highlight]
style = 'pygments'
codeFences = true
pygmentsCodeFences = true
wrapperClass = 'hlc'

[params]
branch = "main"
repositoryUrl = "https://github.com/NorthernTechHQ/alvaldi-docs"
searchBaseUrl = "/api/search"

[params.theme.colors]
primary = "#0A3522" # home page h1
secondary = "#14A452"
link = "#0F8843"
footer = "#0A3522"


# Hugo 0.162+ blocks text/html content files by default
# so explicitly allow the content media types we use
[security]
allowContent = ['^text/(html|markdown|org)$']
